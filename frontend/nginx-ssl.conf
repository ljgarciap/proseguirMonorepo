# Variante HTTPS de nginx.conf, usada SOLO en producción (docker-compose.prod.yml
# la monta reemplazando el conf horneado en la imagen). Los location / , /api,
# /storage son idénticos a nginx.conf — cualquier cambio ahí debe replicarse acá.
server {
    listen 80;
    server_name auto.proseguirliquidez.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name auto.proseguirliquidez.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evitar que el navegador almacene en caché el archivo index.html
    # Esto asegura que el cliente siempre obtenga las últimas referencias (hashes) de JS y CSS
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Proxy hacia el API de Laravel (Puerto 80 interno)
    location /api {
        proxy_pass http://backend_web/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy hacia los archivos (Storage) de Laravel
    location /storage {
        proxy_pass http://backend_web/storage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
