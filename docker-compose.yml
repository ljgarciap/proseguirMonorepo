services:
  db:
    image: mysql:8.0
    container_name: factoring_db
    restart: always
    environment:
      MYSQL_DATABASE: factoring_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    networks:
      - factoring_network
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: factoring_backend
    restart: always
    volumes:
      - ./backend:/var/www/html
      - ./.env:/var/www/html/.env
    environment:
      - DB_HOST=db
      - DB_DATABASE=factoring_db
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - db
    networks:
      - factoring_network

  backend_web:
    image: nginx:stable-alpine
    container_name: factoring_backend_web
    restart: always
    volumes:
      - ./backend:/var/www/html
      - ./backend_web/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - factoring_network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: factoring_queue
    restart: always
    command: php artisan queue:work --tries=3
    volumes:
      - ./backend:/var/www/html
      - ./.env:/var/www/html/.env
    environment:
      - DB_HOST=db
      - DB_DATABASE=factoring_db
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - db
      - backend
    networks:
      - factoring_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: factoring_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend_web
    networks:
      - factoring_network

networks:
  factoring_network:
    driver: bridge

volumes:
  mysql_data:
