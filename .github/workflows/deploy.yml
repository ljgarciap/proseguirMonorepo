name: CI/CD Pipeline - Proseguir Factoring

on:
  push:
    branches: [ master, test ]

jobs:
  test-backend:
    name: Backend Tests (Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, mysql, sqlite
          coverage: pcov
      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --no-progress --prefer-dist
      - name: Setup Env and Generate Key
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate
      - name: Run Tests (SQLite In-Memory)
        run: |
          cd backend
          php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
      - name: Generate Coverage Report
        continue-on-error: true
        run: |
          cd backend
          php artisan test --coverage-clover=coverage/clover.xml --coverage-html=coverage/html
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/html
          retention-days: 14
          if-no-files-found: warn

  test-frontend:
    name: Frontend Tests (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install NPM Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps
      - name: Config Env File
        run: |
          cd frontend
          npm run config-env
      - name: Run Angular Headless Tests
        run: |
          cd frontend
          npm run test:ci
      - name: Generate Coverage Report
        continue-on-error: true
        run: |
          cd frontend
          npm run test:coverage
      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/factoring-frontend
          retention-days: 14
          if-no-files-found: warn

  deploy-prod:
    name: Production Deploy (CD)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/admpsl/apps/proseguir
            
            # 1. Sincronizar y actualizar código
            git fetch origin
            git reset --hard origin/master
            
            # 2. Copiar archivos .env correctos de producción
            cp PROD.env .env
            if [ -f frontend/.env.prod ]; then
              cp frontend/.env.prod frontend/.env
            else
              cp frontend/.env.prod.example frontend/.env
            fi
            
            # 3. Reconstruir frontend y backend conservando volúmenes
            docker compose up -d --build
            
            # Reiniciar Nginx para limpiar la caché DNS y evitar Error 502 Bad Gateway
            docker compose restart backend_web
            
            # 4. Instalar/actualizar dependencias de Composer y Node.js en el backend
            docker exec factoring_backend composer install --no-dev --optimize-autoloader
            docker exec factoring_backend npm install pdfreader
            
            # 5. Migraciones incrementales de DB (SEGURAS, NO FRESH)
            docker exec factoring_backend php artisan migrate --force

            # 5b. Seeder idempotente de configuraciones (updateOrCreate, seguro en cada deploy)
            docker exec factoring_backend php artisan db:seed --class=ConfiguracionSeeder --force

            # 5c. Seeder idempotente de áreas de Bandeja Interna (firstOrCreate, seguro en cada deploy)
            docker exec factoring_backend php artisan db:seed --class=DocumentAreaSeeder --force

            # 5d. Seeder idempotente de departamentos/ciudades de Colombia (firstOrCreate, seguro en cada deploy)
            docker exec factoring_backend php artisan db:seed --class=ColombiaGeografiaSeeder --force

            # 6. Configurar seguridad Passport
            docker exec factoring_backend php artisan passport:install --no-interaction
            docker exec factoring_backend php artisan migrate --force
            docker exec factoring_backend chown -R www-data:www-data storage
            docker exec factoring_backend chmod 600 storage/oauth-private.key
            docker exec factoring_backend chmod 600 storage/oauth-public.key

            # 7. Recrear el enlace simbólico de storage de forma relativa (Evita Error 403)
            docker exec factoring_backend rm -f public/storage
            docker exec factoring_backend ln -s ../storage/app/public public/storage

            # 8. Limpieza y caché para optimizar rendimiento Laravel
            docker exec factoring_backend php artisan config:cache
            docker exec factoring_backend php artisan route:cache
            docker exec factoring_backend chmod -R 777 storage bootstrap/cache
            docker exec factoring_backend chmod 600 storage/oauth-private.key storage/oauth-public.key

            # 9. Reiniciar el worker de la cola para aplicar cambios de código
            docker exec factoring_queue php artisan queue:restart || true

  deploy-test:
    name: Test Deploy (CD)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    steps:
      - name: Deploy to Test Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          password: ${{ secrets.TEST_SSH_PASSWORD }}
          port: ${{ secrets.TEST_SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/admpsl/apps/proseguir
            
            # 1. Sincronizar y actualizar código para rama test
            git fetch origin
            git reset --hard origin/test
            
            # 2. Copiar archivos .env correctos de pruebas (con fallback a producción si no existen específicos de test)
            if [ -f TEST.env ]; then
              cp TEST.env .env
            else
              cp PROD.env .env
            fi

            if [ -f frontend/.env.test ]; then
              cp frontend/.env.test frontend/.env
            else
              cp frontend/.env.prod frontend/.env
            fi
            
            # 3. Reconstruir frontend y backend conservando volúmenes
            docker compose up -d --build
            
            # Reiniciar Nginx para limpiar la caché DNS y evitar Error 502 Bad Gateway
            docker compose restart backend_web
            
            # 4. Instalar/actualizar dependencias de Composer y Node.js en el backend
            docker exec factoring_backend composer install --no-dev --optimize-autoloader
            docker exec factoring_backend npm install pdfreader
            
            # 5. Migraciones incrementales de DB (SEGURAS, NO FRESH)
            docker exec factoring_backend php artisan migrate --force

            # 5b. Seeder idempotente de configuraciones (updateOrCreate, seguro en cada deploy)
            docker exec factoring_backend php artisan db:seed --class=ConfiguracionSeeder --force

            # 5c. Seeder idempotente de áreas de Bandeja Interna (firstOrCreate, seguro en cada deploy)
            docker exec factoring_backend php artisan db:seed --class=DocumentAreaSeeder --force

            # 5d. Seeder idempotente de departamentos/ciudades de Colombia (firstOrCreate, seguro en cada deploy)
            docker exec factoring_backend php artisan db:seed --class=ColombiaGeografiaSeeder --force

            # 6. Configurar seguridad Passport
            docker exec factoring_backend php artisan passport:install --no-interaction
            docker exec factoring_backend php artisan migrate --force
            docker exec factoring_backend chown -R www-data:www-data storage
            docker exec factoring_backend chmod 600 storage/oauth-private.key
            docker exec factoring_backend chmod 600 storage/oauth-public.key

            # 7. Recrear el enlace simbólico de storage de forma relativa (Evita Error 403)
            docker exec factoring_backend rm -f public/storage
            docker exec factoring_backend ln -s ../storage/app/public public/storage

            # 8. Limpieza y caché para optimizar rendimiento Laravel
            docker exec factoring_backend php artisan config:cache
            docker exec factoring_backend php artisan route:cache
            docker exec factoring_backend chmod -R 777 storage bootstrap/cache
            docker exec factoring_backend chmod 600 storage/oauth-private.key storage/oauth-public.key

            # 9. Reiniciar el worker de la cola para aplicar cambios de código
            docker exec factoring_queue php artisan queue:restart || true
